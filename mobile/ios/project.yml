# XcodeGen spec — the .xcodeproj is generated from this file and not committed.
#   brew install xcodegen && xcodegen generate
name: Asseta
options:
  bundleIdPrefix: com.asseta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  AssetaKit:
    path: AssetaKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      # Local Docker Compose stack (see repo README). Override per environment.
      ASSETA_API_BASE_URL: "http://localhost:8000"
      ASSETA_OIDC_ISSUER: "http://localhost:8080/realms/asseta"
    Release:
      # Production (docs/deployment-live.md). Override per environment, e.g.
      #   xcodebuild ... ASSETA_API_BASE_URL=https://staging.example ASSETA_OIDC_ISSUER=https://staging.example/auth/realms/asseta
      ASSETA_API_BASE_URL: "https://asseta.co.tz"
      ASSETA_OIDC_ISSUER: "https://asseta.co.tz/auth/realms/asseta"

targetTemplates:
  AssetaApp:
    type: application
    platform: iOS
    sources:
      - path: Apps/Shared
    dependencies:
      - package: AssetaKit
        product: AssetaAppShell
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      properties:
        CFBundleDisplayName: $(ASSETA_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Endpoints injected from build settings (no URLs in source).
        AssetaAPIBaseURL: $(ASSETA_API_BASE_URL)
        AssetaOIDCIssuer: $(ASSETA_OIDC_ISSUER)
        # Per-app OIDC redirects (each app has its own private-use scheme; see target settings).
        AssetaOIDCRedirectURI: $(ASSETA_OIDC_SCHEME):/oauth2redirect
        AssetaOIDCPostLogoutRedirectURI: $(ASSETA_OIDC_SCHEME):/logout
        # Allows plain-HTTP to localhost/.local only (dev Compose stack); public hosts still need TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

targets:
  AssetaSupervisor:
    templates: [AssetaApp]
    sources:
      - path: Apps/Supervisor
        excludes: ["Info.plist"]
    dependencies:
      - package: AssetaKit
        product: AssetaField
    info:
      path: Apps/Supervisor/Info.plist
      properties:
        # Requested just in time (first meter photo / first capture). No background location.
        NSCameraUsageDescription: "Asseta Field uses the camera to photograph hour meters as reading evidence."
        NSLocationWhenInUseUsageDescription: "Asseta Field records your location with every meter reading so the reading can be verified."
        # Opportunistic background refresh only (BGAppRefreshTask); iOS decides when, if at all.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.asseta.supervisor.sync]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asseta.supervisor
        PRODUCT_NAME: AssetaSupervisor
        ASSETA_DISPLAY_NAME: Asseta Field
        ASSETA_OIDC_SCHEME: com.asseta.supervisor

  AssetaOwner:
    templates: [AssetaApp]
    sources:
      - path: Apps/Owner
        excludes: ["Info.plist"]
    dependencies:
      - package: AssetaKit
        product: AssetaOwnerUI
    info:
      path: Apps/Owner/Info.plist
      properties:
        # Capability check for APNs: stays NO until the build is signed with a provisioning profile
        # carrying the aps-environment entitlement (see README "Owner push notifications").
        AssetaPushEnabled: $(ASSETA_PUSH_ENABLED)
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asseta.owner
        PRODUCT_NAME: AssetaOwner
        ASSETA_DISPLAY_NAME: Asseta Owner
        ASSETA_OIDC_SCHEME: com.asseta.owner
        ASSETA_PUSH_ENABLED: "NO"

  AssetaSupervisorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/SupervisorTests]
    dependencies:
      - target: AssetaSupervisor
      - package: AssetaKit
        product: AssetaStore
      - package: AssetaKit
        product: AssetaSync
      - package: AssetaKit
        product: AssetaCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asseta.supervisor.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AssetaSupervisor.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AssetaSupervisor
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  AssetaSupervisor:
    build:
      targets:
        AssetaSupervisor: all
    test:
      targets: [AssetaSupervisorTests]
  AssetaOwner:
    build:
      targets:
        AssetaOwner: all
