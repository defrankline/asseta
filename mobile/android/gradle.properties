org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Environment endpoints (override per machine/CI with -P or ~/.gradle/gradle.properties).
# Debug defaults target the local Docker Compose stack from the Android emulator (10.0.2.2 = host).
asseta.debug.apiBaseUrl=http://10.0.2.2:8000/
asseta.debug.keycloakIssuer=http://10.0.2.2:8080/realms/asseta
# Release endpoints: production (docs/deployment-live.md); https only, the app refuses to start with blank values.
asseta.release.apiBaseUrl=https://asseta.co.tz/
asseta.release.keycloakIssuer=https://asseta.co.tz/auth/realms/asseta

# Slow mirrors: tolerate large artifact downloads instead of failing on read timeouts.
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
