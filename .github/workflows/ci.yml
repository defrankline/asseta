name: ci
on:
  push: {branches: [main]}
  pull_request:

concurrency: {group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      ASSETA_DATABASE_URL: postgresql+psycopg://asseta_app:asseta_app@localhost:5432/asseta_test
      ASSETA_MIGRATION_DATABASE_URL: postgresql+psycopg://asseta_owner:asseta_owner@localhost:5432/asseta_test
      PGPASSWORD: postgres
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.7"}
      - name: Create least-privilege roles and test database
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE asseta_owner LOGIN PASSWORD 'asseta_owner';
          CREATE ROLE asseta_app LOGIN PASSWORD 'asseta_app';
          CREATE DATABASE asseta_test OWNER asseta_owner;
          \connect asseta_test
          CREATE EXTENSION postgis; CREATE EXTENSION pgcrypto;
          ALTER SCHEMA public OWNER TO asseta_owner;
          GRANT USAGE ON SCHEMA public TO asseta_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE asseta_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO asseta_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE asseta_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO asseta_app;
          SQL
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations scripts
      - run: uv run ruff format --check src tests migrations scripts
      - run: uv run mypy src tests scripts
      - name: Migrations up/down/up + drift check
        run: |
          uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q
      - name: OpenAPI contract is current
        run: uv run python scripts/export_openapi.py --check

  web:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: node scripts/gen-api.mjs --strict && git diff --exit-code src/api/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  android:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: mobile/android}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "25"}
      - name: Android SDK packages (runner image ships the SDK; accept licenses non-interactively)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" > /dev/null
      - run: ./gradlew assembleDebug testDebugUnitTest lint assembleAndroidTest --console=plain

  ios:
    runs-on: macos-26
    defaults: {run: {working-directory: mobile/ios}}
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: cd AssetaKit && swift test
      - run: |
          for s in AssetaSupervisor AssetaOwner; do
            xcodebuild -project Asseta.xcodeproj -scheme $s -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          done
