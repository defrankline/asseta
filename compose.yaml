# Asseta Release 1 — reproducible development / initial deployment stack.
# Images are pinned (digest where pulled from a registry). Secrets come from .env (see .env.example).
# Traccar is in the `telemetry` profile (Gate 2). TLS/reverse proxy for deployments: docs/operating-runbook.md.
name: asseta

x-api-env: &api-env
  ASSETA_ENVIRONMENT: ${ASSETA_ENVIRONMENT:-development}
  ASSETA_DATABASE_URL: postgresql+psycopg://asseta_app:${ASSETA_APP_DB_PASSWORD}@postgres:5432/asseta
  ASSETA_MIGRATION_DATABASE_URL: postgresql+psycopg://asseta_owner:${ASSETA_OWNER_DB_PASSWORD}@postgres:5432/asseta
  ASSETA_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  ASSETA_KAFKA_BOOTSTRAP: kafka:9092
  ASSETA_S3_ENDPOINT: http://minio:9000
  ASSETA_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  ASSETA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  ASSETA_KEYCLOAK_URL: http://keycloak:8080
  ASSETA_KEYCLOAK_PUBLIC_URL: ${ASSETA_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
  ASSETA_KEYCLOAK_API_CLIENT_SECRET: ${ASSETA_API_CLIENT_SECRET}
  ASSETA_CORS_ORIGINS: '["${ASSETA_WEB_URL:-http://localhost:5173}"]'
  ASSETA_MLFLOW_TRACKING_URI: http://mlflow:5000  # optional: training still records runs locally when MLflow is down
  ASSETA_DB_LOCK_TIMEOUT_MS: ${ASSETA_DB_LOCK_TIMEOUT_MS:-5000}  # Gate 7E drills: fail fast (503) on lock waits
  ASSETA_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${ASSETA_DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
  ASSETA_DB_STATEMENT_TIMEOUT_MS: ${ASSETA_DB_STATEMENT_TIMEOUT_MS:-30000}  # F-7: API requests; workers override
  ASSETA_MAX_REQUEST_BYTES: ${ASSETA_MAX_REQUEST_BYTES:-11534336}  # F-6: 11 MiB, as nginx client_max_body_size

# Background workers run sweeps, replays and batch jobs that legitimately outlast an API request: a longer bound.
x-worker-statement-timeout: &worker-statement-timeout ${ASSETA_WORKER_DB_STATEMENT_TIMEOUT_MS:-300000}

# SMS provider for notification SMS (console = logs only, sends nothing). Credentials only from .env.
x-sms-env: &sms-env
  ASSETA_SMS_PROVIDER: ${ASSETA_SMS_PROVIDER:-console}
  ASSETA_SMS_DEFAULT_COUNTRY_CODE: ${ASSETA_SMS_DEFAULT_COUNTRY_CODE:-255}
  ASSETA_NEXTSMS_URL: ${ASSETA_NEXTSMS_URL:-https://messaging-service.co.tz/api/sms/v1/text/single}
  ASSETA_NEXTSMS_SENDER_ID: ${ASSETA_NEXTSMS_SENDER_ID:-}
  ASSETA_NEXTSMS_USERNAME: ${ASSETA_NEXTSMS_USERNAME:-}
  ASSETA_NEXTSMS_PASSWORD: ${ASSETA_NEXTSMS_PASSWORD:-}
  ASSETA_NEXTSMS_AUTH_TOKEN: ${ASSETA_NEXTSMS_AUTH_TOKEN:-}

# Push + e-mail notification channels (Gate 7). console = log only (code default). Key files (FCM service-account
# JSON, APNs .p8) are never committed: mount them read-only into notification-worker (e.g. compose.override.yaml)
# and point the *_FILE variables at the mounted paths. Local dev e-mail: see the Mailpit block in .env.example.
x-channel-env: &channel-env
  ASSETA_EMAIL_PROVIDER: ${ASSETA_EMAIL_PROVIDER:-console}
  ASSETA_EMAIL_FROM: ${ASSETA_EMAIL_FROM:-Asseta <no-reply@asseta.local>}
  ASSETA_EMAIL_SMTP_HOST: ${ASSETA_EMAIL_SMTP_HOST:-}
  ASSETA_EMAIL_SMTP_PORT: ${ASSETA_EMAIL_SMTP_PORT:-587}
  ASSETA_EMAIL_SMTP_USERNAME: ${ASSETA_EMAIL_SMTP_USERNAME:-}
  ASSETA_EMAIL_SMTP_PASSWORD: ${ASSETA_EMAIL_SMTP_PASSWORD:-}
  ASSETA_EMAIL_SMTP_SECURITY: ${ASSETA_EMAIL_SMTP_SECURITY:-starttls}
  ASSETA_PUSH_ANDROID_PROVIDER: ${ASSETA_PUSH_ANDROID_PROVIDER:-console}
  ASSETA_PUSH_IOS_PROVIDER: ${ASSETA_PUSH_IOS_PROVIDER:-console}
  ASSETA_PUSH_FCM_SERVICE_ACCOUNT_FILE: ${ASSETA_PUSH_FCM_SERVICE_ACCOUNT_FILE:-}
  ASSETA_PUSH_FCM_PROJECT_ID: ${ASSETA_PUSH_FCM_PROJECT_ID:-}
  ASSETA_PUSH_APNS_KEY_FILE: ${ASSETA_PUSH_APNS_KEY_FILE:-}
  ASSETA_PUSH_APNS_KEY_ID: ${ASSETA_PUSH_APNS_KEY_ID:-}
  ASSETA_PUSH_APNS_TEAM_ID: ${ASSETA_PUSH_APNS_TEAM_ID:-}
  ASSETA_PUSH_APNS_TOPIC: ${ASSETA_PUSH_APNS_TOPIC:-}
  ASSETA_PUSH_APNS_SUPERVISOR_TOPIC: ${ASSETA_PUSH_APNS_SUPERVISOR_TOPIC:-}
  ASSETA_PUSH_APNS_ENVIRONMENT: ${ASSETA_PUSH_APNS_ENVIRONMENT:-production}
  ASSETA_NOTIFY_WEB_BASE_URL: ${ASSETA_WEB_URL:-http://localhost:5173}  # links in e-mails

services:
  postgres:
    build: ./infra/postgres
    image: asseta/postgis:18-3.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      ASSETA_OWNER_DB_PASSWORD: ${ASSETA_OWNER_DB_PASSWORD:?set in .env}
      ASSETA_APP_DB_PASSWORD: ${ASSETA_APP_DB_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    ports: ["127.0.0.1:${ASSETA_PG_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql]  # PG18+ layout
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d asseta"], interval: 5s, retries: 20}

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${ASSETA_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}  # fixed public issuer
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"  # API reaches Keycloak at http://keycloak:8080 internally
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      ASSETA_API_CLIENT_SECRET: ${ASSETA_API_CLIENT_SECRET:?set in .env}
      ASSETA_WEB_URL: ${ASSETA_WEB_URL:-http://localhost:5173}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/asseta:/opt/keycloak/themes/asseta:ro  # branded login pages
    ports: ["127.0.0.1:${ASSETA_KEYCLOAK_PORT:-8080}:8080"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
    healthcheck:  # image has no curl: raw HTTP to the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29192,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${ASSETA_KAFKA_PORT:-29192}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    ports: ["127.0.0.1:${ASSETA_KAFKA_PORT:-29192}:29192"]
    volumes: [kafkadata:/var/lib/kafka/data]

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:${ASSETA_REDIS_PORT:-6380}:6379"]

  minio:
    build: ./infra/minio  # built from source: MinIO no longer publishes pullable images
    image: asseta/minio:RELEASE.2024-07-16T23-46-41Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports: ["127.0.0.1:${ASSETA_MINIO_PORT:-9100}:9000", "127.0.0.1:${ASSETA_MINIO_CONSOLE_PORT:-9101}:9001"]
    volumes: [miniodata:/data]

  mlflow-db-init:  # one-shot, idempotent: MLflow backend-store role + database (fresh or existing pg volume)
    image: asseta/postgis:18-3.6
    entrypoint: ["bash", "/opt/asseta/mlflow-db.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?set in .env}
    volumes: ["./infra/postgres/mlflow-db.sh:/opt/asseta/mlflow-db.sh:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  mlflow:  # Gate 6 (ADR-007): experiment runs + artifacts; Asseta's model_version tables stay the governance record
    build: ./infra/mlflow
    image: asseta/mlflow:3.17.0
    environment:
      MLFLOW_DB_USER: mlflow
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?set in .env}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_ARTIFACT_BUCKET: asseta-mlflow
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:${ASSETA_MLFLOW_PORT:-5500}:5000"]
    depends_on:
      mlflow-db-init: {condition: service_completed_successfully}
      minio: {condition: service_started}
    restart: unless-stopped

  migrate:
    build: ./backend
    image: asseta/api:dev
    command: ["sh", "-c", "alembic upgrade head && asseta-bootstrap"]
    environment:
      <<: *api-env
      ASSETA_TRACCAR_GATEWAY_KEY: ${ASSETA_TRACCAR_GATEWAY_KEY:?set in .env}
      ASSETA_DB_STATEMENT_TIMEOUT_MS: 0  # bootstrap (alembic uses its own owner engine without limits)
    depends_on: {postgres: {condition: service_healthy}}

  api:
    image: asseta/api:dev
    environment: {<<: [*api-env, *sms-env]}  # sms: platform test-send
    ports: ["127.0.0.1:${ASSETA_API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
      kafka: {condition: service_started}
    restart: unless-stopped  # fails fast if Keycloak authz sync cannot run; restarts until it can

  outbox-relay:
    image: asseta/api:dev
    command: ["asseta-outbox-relay"]
    environment: {<<: *api-env, ASSETA_DB_STATEMENT_TIMEOUT_MS: *worker-statement-timeout}
    healthcheck: {disable: true}  # no HTTP endpoint; backlog is monitored via outbox_event (runbook)
    restart: unless-stopped
    depends_on: {migrate: {condition: service_completed_successfully}, kafka: {condition: service_started}}

  billing-scheduler:
    image: asseta/api:dev
    command: ["asseta-billing-scheduler"]
    environment: {<<: *api-env, ASSETA_DB_STATEMENT_TIMEOUT_MS: *worker-statement-timeout}
    healthcheck: {disable: true}
    restart: unless-stopped
    depends_on: {migrate: {condition: service_completed_successfully}}

  timeline-worker:
    image: asseta/api:dev
    command: ["asseta-timeline-worker"]
    environment: {<<: *api-env, ASSETA_DB_STATEMENT_TIMEOUT_MS: *worker-statement-timeout}
    healthcheck: {disable: true}
    restart: unless-stopped
    depends_on: {migrate: {condition: service_completed_successfully}, kafka: {condition: service_started}}

  connectivity-worker:
    image: asseta/api:dev
    command: ["asseta-connectivity-worker"]
    environment: {<<: *api-env, ASSETA_DB_STATEMENT_TIMEOUT_MS: *worker-statement-timeout}
    healthcheck: {disable: true}
    restart: unless-stopped
    depends_on: {migrate: {condition: service_completed_successfully}}

  intelligence-worker:  # Gate 6 (ADR-007): deterministic risk signals + investigation cases (event-driven + sweep)
    image: asseta/api:dev
    command: ["asseta-intelligence-worker"]
    environment: {<<: *api-env, ASSETA_DB_STATEMENT_TIMEOUT_MS: *worker-statement-timeout}
    healthcheck: {disable: true}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_started}

  notification-worker:  # DEC-022: domain events -> rules -> inbox + WebSocket (Redis) + SMS (wallet-metered)
    image: asseta/api:dev
    command: ["asseta-notification-worker"]
    environment:  # + PUSH/EMAIL dispatch (Gate 7)
      <<: [*api-env, *sms-env, *channel-env]
      ASSETA_DB_STATEMENT_TIMEOUT_MS: *worker-statement-timeout
    healthcheck: {disable: true}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_started}
      redis: {condition: service_started}

  notification-scheduler:  # DEC-022: reminders (idempotent per tenant-local day) + membership mirror refresh
    image: asseta/api:dev
    command: ["asseta-notification-scheduler"]
    environment: {<<: *api-env, ASSETA_DB_STATEMENT_TIMEOUT_MS: *worker-statement-timeout}
    healthcheck: {disable: true}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      keycloak: {condition: service_healthy}

  web:
    build:
      context: ./web
      args: {VITE_KEYCLOAK_URL: "${ASSETA_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}"}
    image: asseta/web:dev
    environment:  # F-5: client IP for rate limits comes from X-Forwarded-For only when sent by this proxy address
      ASSETA_TRUSTED_PROXY_CIDR: ${ASSETA_TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    ports: ["127.0.0.1:${ASSETA_WEB_PORT:-5173}:8080"]
    depends_on: [api]

  traccar:
    profiles: [telemetry]
    environment:  # Traccar config via env (CONFIG_USE_ENVIRONMENT_VARIABLES): forward positions to Asseta
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      FORWARD_TYPE: json
      FORWARD_JSON: "true"
      FORWARD_URL: http://api:8000/api/v1/telemetry/traccar
      FORWARD_HEADER: "X-Asseta-Gateway-Key: ${ASSETA_TRACCAR_GATEWAY_KEY}"
      FORWARD_RETRY_ENABLE: "true"
      DATABASE_REGISTER_UNKNOWN: "true"  # dev only; Asseta still quarantines devices not registered to a tenant
      LOGGER_LEVEL: info
    image: traccar/traccar:6.10.0@sha256:bff38968f98f4c1739fa2da7b586f9eb03de7968cb8e86c55f31b69d5fbc9a0c
    ports: ["127.0.0.1:${ASSETA_TRACCAR_PORT:-8082}:8082", "127.0.0.1:${ASSETA_TRACCAR_OSMAND_PORT:-5055}:5055"]
    volumes: [traccardata:/opt/traccar/data]

  mailpit:  # local dev SMTP sink (Gate 7): SMTP on mailpit:1025 inside the network only; web UI on 127.0.0.1
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:${ASSETA_MAILPIT_UI_PORT:-8025}:8025"]
    healthcheck: {test: ["CMD", "/mailpit", "readyz"], interval: 10s, retries: 10}
    restart: unless-stopped

volumes: {pgdata: {}, kafkadata: {}, miniodata: {}, traccardata: {}}
