# Rendered at container start by the nginx image's envsubst step (web/Dockerfile copies this file to
# /etc/nginx/templates/; only ASSETA_* variables are substituted, nginx's own $variables are left alone).

# --- Request limits (docs/security.md F-5, F-6) -------------------------------------------------------------------
# Per client IP, at this proxy only: Traccar forwards to api:8000 on the internal Docker network and workers never
# pass through here, so internal traffic is not throttled. Sizing: a console page load fans out to ~20 API calls, a
# phone uploads a 10 MB photo as ~40 sync chunks, and phones behind one carrier NAT share an address. A flood gets
# 429 RATE_LIMITED in the API's error envelope.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# Expensive calls (report exports, ML training, invoice generation, test notifications): seconds of work each.
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=1r/s;
# Gateway ingest, only for a Traccar host outside this network (100 trackers every 10-30 s is ~10 r/s).
limit_req_zone $binary_remote_addr zone=gateway:1m rate=50r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;  # keycloak-js silent check-sso uses a same-origin iframe
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Behind a TLS proxy every client arrives from the proxy's address; take the client IP from X-Forwarded-For, but
  # only when the proxy itself sent it (ASSETA_TRUSTED_PROXY_CIDR, default loopback = nobody), so a client cannot
  # choose its own rate-limit bucket.
  set_real_ip_from ${ASSETA_TRUSTED_PROXY_CIDR};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # Largest image (10 MiB) plus multipart framing; the API enforces the same bound (ASSETA_MAX_REQUEST_BYTES).
  client_max_body_size 11m;
  error_page 413 = @payload_too_large;
  error_page 429 = @rate_limited;
  # Re-resolve the api container through Docker's DNS: a static upstream pins the IP seen at startup, so
  # recreating or redeploying api returned 502 until this container restarted. A variable proxy_pass (no URI
  # part) forwards the original request URI unchanged.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Real-time notifications (DEC-022): WebSocket upgrade needs HTTP/1.1 + Upgrade/Connection forwarding and a
  # read timeout longer than the server heartbeat.
  location = /api/v1/ws {
    limit_req zone=api burst=150 nodelay;  # reconnect storms after an API restart stay within the burst
    proxy_pass $api_upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
  location ~ ^/api/v1/(?:(?:tenant|platform)/reports/[^/]+\.(?:csv|pdf)|platform/ml/tenants/[^/]+/train|platform/notifications/test-send|platform/subscriptions/[^/]+/invoices/generate)$ {
    limit_req zone=api burst=150 nodelay;
    limit_req zone=api_heavy burst=10 nodelay;
    proxy_pass $api_upstream;
  }
  location = /api/v1/telemetry/traccar {
    limit_req zone=gateway burst=200 nodelay;
    proxy_pass $api_upstream;
  }
  location /api/ {
    limit_req zone=api burst=150 nodelay;
    proxy_pass $api_upstream;
  }
  # Proxy-generated refusals in the API's error envelope (core/errors.py); nginx's request id is the correlation id.
  location @rate_limited {
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Correlation-ID $request_id always;
    add_header Retry-After 1 always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests; retry shortly","correlation_id":"$request_id","details":[]}}';
  }
  location @payload_too_large {
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Correlation-ID $request_id always;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body exceeds the 11 MiB limit","correlation_id":"$request_id","details":[]}}';
  }
  # Hashed bundles are immutable; the HTML shell must revalidate so a deploy is picked up at once.
  # `expires` (not add_header) keeps the server-level security headers inherited.
  location /assets/ { expires 1y; }
  location / { expires -1; try_files $uri /index.html; }
}
