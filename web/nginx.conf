server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;  # keycloak-js silent check-sso uses a same-origin iframe
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Re-resolve the api container through Docker's DNS: a static upstream pins the IP seen at startup, so
  # recreating or redeploying api returned 502 until this container restarted. A variable proxy_pass (no URI
  # part) forwards the original request URI unchanged.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  # Real-time notifications (DEC-022): WebSocket upgrade needs HTTP/1.1 + Upgrade/Connection forwarding and a
  # read timeout longer than the server heartbeat.
  location = /api/v1/ws {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
  location /api/ { proxy_pass $api_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  # Hashed bundles are immutable; the HTML shell must revalidate so a deploy is picked up at once.
  # `expires` (not add_header) keeps the server-level security headers inherited.
  location /assets/ { expires 1y; }
  location / { expires -1; try_files $uri /index.html; }
}
